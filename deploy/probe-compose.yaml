name: narbe-probe
services:
  probe:
    # Candidate image is built locally; no public probe tag is implied.
    image: narbe-probe:cn-candidate
    build:
      context: ..
      dockerfile: Dockerfile.probe
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 96m
    environment:
      NARBE_PROBE_CONTROL_URL: ${NARBE_PROBE_CONTROL_URL:?请配置管理端 HTTPS 地址}
      NARBE_PROBE_REGISTRATION_TOKEN_FILE: /run/secrets/registration_token
      NARBE_PROBE_ALLOWED_PORTS: ${NARBE_PROBE_ALLOWED_PORTS:-22,80,443,8443,8080}
    secrets:
      - registration_token
    volumes:
      - probe_data:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
secrets:
  registration_token:
    file: ./probe-registration-token.txt
volumes:
  probe_data:

name: Narbe beta release
on:
  push:
    branches: [codex/cn-connectivity]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/ci.yml'
      - 'Dockerfile'
      - 'release/**'
permissions:
  contents: read
concurrency:
  group: narbe-v0.1.0-beta.6-release
  cancel-in-progress: false
env:
  # Explicit Owner test-release authorization; no new formal review is claimed.
  AUTHORIZED_SOURCE_SHA: ${{ vars.NARBE_BETA6_OWNER_AUTHORIZED_SHA }}
jobs:
  source-gate:
    if: github.repository == 'pixingzoudaiyuexing/Narbe' && vars.NARBE_BETA6_OWNER_AUTHORIZED_SHA != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      approved: ${{ steps.approval.outputs.approved }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact Owner-authorized source before granting package permissions
        id: approval
        run: |
          set -euo pipefail
          [[ "$AUTHORIZED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$AUTHORIZED_SOURCE_SHA" = "$GITHUB_SHA"
          git show "$AUTHORIZED_SOURCE_SHA:release/verify_source.py" > "$RUNNER_TEMP/narbe-authorized-source.py"
          python3 "$RUNNER_TEMP/narbe-authorized-source.py" --owner-authorized-test-source "$AUTHORIZED_SOURCE_SHA" --head "$GITHUB_SHA" --output "$RUNNER_TEMP/narbe-source-gate.json"
          echo 'approved=true' >> "$GITHUB_OUTPUT"
      - name: Verify Probe installer rejection and persistence rules
        run: |
          python3 release/test_verify_images.py
          python3 release/test_probe_install.py --unit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: narbe-source-gate
          path: ${{ runner.temp }}/narbe-source-gate.json
          retention-days: 7
          if-no-files-found: error
  verify-ci:
    needs: source-gate
    if: needs.source-gate.outputs.approved == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require complete successful push CI for this exact source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release/verify_ci.py --sha "$GITHUB_SHA" --timeout 900 --output .local/release-ci/ci.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: narbe-final-ci-evidence
          path: .local/release-ci/ci.json
          retention-days: 7
          if-no-files-found: error
  build:
    needs: source-gate
    if: needs.source-gate.outputs.approved == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck trusted source gate before native build
        run: |
          set -euo pipefail
          [[ "$AUTHORIZED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$AUTHORIZED_SOURCE_SHA" = "$GITHUB_SHA"
          git show "$AUTHORIZED_SOURCE_SHA:release/verify_source.py" > "$RUNNER_TEMP/narbe-authorized-source.py"
          python3 "$RUNNER_TEMP/narbe-authorized-source.py" --owner-authorized-test-source "$AUTHORIZED_SOURCE_SHA" --head "$GITHUB_SHA" --output "$RUNNER_TEMP/narbe-source-gate.json"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Native build and runtime verification
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version=$(cat release/VERSION)
          test "$version" = v0.1.0-beta.6
          host_arch=$(uname -m)
          case "$ARCH:$host_arch" in amd64:x86_64|arm64:aarch64) ;; *) exit 1 ;; esac
          builder="narbe-release-$GITHUB_RUN_ID-$ARCH"
          image="narbe/release:$GITHUB_SHA-$ARCH"
          cleanup() { status=$?; trap - EXIT; docker buildx rm "$builder" || status=1; exit "$status"; }
          trap cleanup EXIT
          docker buildx create --name "$builder" --driver docker-container --driver-opt image=mcr.microsoft.com/oss/v2/moby/buildkit:v0.34.0@sha256:51344df7c403f96f2e7fe41f4934daebc1ca8864bf314ff15a69c676be2e284c >/dev/null
          docker buildx build --builder "$builder" --load --provenance=false --platform "linux/$ARCH" --build-arg "VERSION=$version" --build-arg "REVISION=$GITHUB_SHA" -t "$image" .
          test "$(docker image inspect "$image" --format '{{.Architecture}}')" = "$ARCH"
          NARBE_IMAGE="$image" python3 scripts/test_runtime.py
          probe_image="narbe-probe/release:$GITHUB_SHA-$ARCH"
          docker buildx build --builder "$builder" --load --provenance=false --platform "linux/$ARCH" --build-arg "VERSION=$version" --build-arg "REVISION=$GITHUB_SHA" -f Dockerfile.probe -t "$probe_image" .
          test "$(docker image inspect "$probe_image" --format '{{.Architecture}}')" = "$ARCH"
          NARBE_PROBE_IMAGE="$probe_image" python3 scripts/test_probe_runtime.py
          python3 release/test_probe_install.py --image "$probe_image" --arch "$ARCH" --revision "$GITHUB_SHA"
          mkdir -p .local/release-image
          docker save "$image" | gzip > ".local/release-image/manager-$ARCH.tar.gz"
          docker save "$probe_image" | gzip > ".local/release-image/probe-$ARCH.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: narbe-images-${{ matrix.arch }}
          path: .local/release-image/*.tar.gz
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [source-gate, verify-ci, build]
    if: needs.source-gate.result == 'success' && needs.verify-ci.result == 'success' && needs.build.result == 'success' && needs.source-gate.outputs.approved == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck Owner-authorized scripts before exposing registry token
        run: |
          set -euo pipefail
          [[ "$AUTHORIZED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$AUTHORIZED_SOURCE_SHA" = "$GITHUB_SHA"
          git show "$AUTHORIZED_SOURCE_SHA:release/verify_source.py" > "$RUNNER_TEMP/narbe-authorized-source.py"
          python3 "$RUNNER_TEMP/narbe-authorized-source.py" --owner-authorized-test-source "$AUTHORIZED_SOURCE_SHA" --head "$GITHUB_SHA" --output "$RUNNER_TEMP/narbe-source-gate.json"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: narbe-images-*
          path: .local/release-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: narbe-final-ci-evidence
          path: .local/release-ci
      - name: Publish immutable version and multi-architecture index
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release/publish.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: narbe-release-metadata
          path: .local/release-output/release.json
          retention-days: 7
          if-no-files-found: error
  verify-published:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: narbe-release-metadata
          path: .local/release-metadata
      - name: Pull published manifest and install on native architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          umask 077
          export DOCKER_CONFIG="$RUNNER_TEMP/narbe-anonymous-pull"
          mkdir -p "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          test ! -e "$DOCKER_CONFIG/config.json"
          image=$(python3 -c 'import json; r=json.load(open(".local/release-metadata/release.json")); print(r["image"]+":"+r["version"]+"@"+r["digest"])')
          docker pull --platform "linux/$ARCH" "$image"
          python3 release/test_install.py --image "$image" --arch "$ARCH" --revision "$GITHUB_SHA"
          docker pull "ghcr.io/pixingzoudaiyuexing/narbe:v0.1.0-beta.5@sha256:bd27a8523fb2221ab5b66778a4e9408800281dcfc6c7dfc9d543e4117afea070"
          python3 scripts/test_upgrade.py --old-image "ghcr.io/pixingzoudaiyuexing/narbe:v0.1.0-beta.5@sha256:bd27a8523fb2221ab5b66778a4e9408800281dcfc6c7dfc9d543e4117afea070" --new-image "$image"
          probe_image=$(python3 -c 'import json; r=json.load(open(".local/release-metadata/release.json"))["probe"]; print(r["image"]+":"+r["tag"]+"@"+r["digest"])')
          docker pull --platform "linux/$ARCH" "$probe_image"
          NARBE_PROBE_IMAGE="$probe_image" python3 scripts/test_probe_runtime.py
          python3 release/test_probe_install.py --image "$probe_image" --arch "$ARCH" --revision "$GITHUB_SHA"
  bundle:
    needs: verify-published
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: narbe-release-metadata
          path: .local/release-metadata
      - name: Create digest-pinned installation bundle
        run: python3 release/bundle.py .local/release-metadata/release.json .local/release-dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: narbe-beta-release-files
          path: .local/release-dist/*
          retention-days: 7
          if-no-files-found: error
